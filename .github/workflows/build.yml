
name: Build ROYA Social Bots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Prepare project files
        run: |
          mkdir -p src/main/java/com/roya/socialbots
          mkdir -p src/main/resources
          cp RoyaSocialBots.java src/main/java/com/roya/socialbots/
          cp plugin.yml config.yml src/main/resources/

      - name: Build plugin
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ROYA-SocialBots-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
